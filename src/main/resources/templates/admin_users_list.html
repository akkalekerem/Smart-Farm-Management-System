<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Paneli - Kullanıcı Listesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

<div th:replace="~{fragments/admin_sidebar :: adminSidebar('users')}"></div>

<main class="flex-1 overflow-y-auto p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Sistemdeki Kullanıcılar</h1>
            <span class="text-sm bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-medium" th:text="${users.size() + ' Kayıt Bulundu'}"></span>
        </div>

        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-gray-100 text-gray-700 text-sm uppercase tracking-wider">
                <th class="p-3 border-b font-bold text-xs">Ad Soyad</th>
                <th class="p-3 border-b font-bold text-xs">E-Posta Adresi</th>
                <th class="p-3 border-b font-bold text-xs text-center">Rol</th>
                <th class="p-3 border-b font-bold text-xs text-center">İşlemler</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}" class="hover:bg-gray-50 border-b transition duration-150">
                <td class="p-3 text-gray-800 font-medium" th:text="${user.firstName + ' ' + user.lastName}">Ad Soyad</td>
                <td class="p-3 text-gray-600" th:text="${user.email}">Email</td>

                <td class="p-3 text-center">
                    <span th:if="${user.role != null and user.role.name() == 'ADMIN'}" class="px-3 py-1 text-xs font-bold rounded-full bg-red-100 text-red-800 border border-red-200">
                        ADMIN
                    </span>
                    <span th:if="${user.role != null and user.role.name() == 'USER'}" class="px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800 border border-green-200">
                        USER
                    </span>
                    <span th:if="${user.role == null}" class="px-3 py-1 text-xs font-bold rounded-full bg-gray-200 text-gray-600 border border-gray-300">
                        BELİRSİZ
                    </span>
                </td>

                <td class="p-3 text-center space-x-4">
                    <a th:href="@{/admin/user/detail/{id}(id=${user.id})}" class="text-blue-500 hover:text-blue-700 font-bold text-sm inline-flex items-center">
                        🔍 Detaylar
                    </a>
                    <span class="text-gray-300">|</span>
                    <a th:href="@{/admin/user/delete/{id}(id=${user.id})}"
                       class="text-red-500 hover:text-red-700 font-bold text-sm inline-flex items-center"
                       onclick="return confirm('Bu kullanıcıyı ve kullanıcıya ait tüm verileri silmek istediğinizden emin misiniz?');">
                        🗑️ Sil
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4" class="p-10 text-center text-gray-500 italic bg-gray-50">
                    Sistemde henüz kayıtlı bir kullanıcı bulunmuyor.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
